name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      API_DOMAIN: apilibros.alexvyumes-dev.com
      WEB_DOMAIN: libros.alexvyumes-dev.com
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE=ghcr.io/${OWNER}/libros-api:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${OWNER}/libros-web:${{ github.sha }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            VITE_API_URL=https://${{ env.API_DOMAIN }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/libros/docker-compose.yml"

      - name: Deploy
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh -i ~/.ssh/deploy_key "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "cd /opt/libros && export API_IMAGE=${API_IMAGE} WEB_IMAGE=${WEB_IMAGE} && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${API_DOMAIN}/health"; then exit 0; fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          exit 1
